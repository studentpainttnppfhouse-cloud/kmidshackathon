# Render blueprint for Hackathon Studio.
#
# Deploying: create a Blueprint from this repo, then set DATABASE_URL in the
# Render dashboard to the TiDB Cloud connection string. Everything else is
# either generated or has a working default.

services:
  - type: web
    name: hackathon-studio
    runtime: node
    plan: free
    region: singapore # closest Render region to Bangkok
    branch: main
    healthCheckPath: /api/health
    buildCommand: npm ci && npx prisma generate && npm run db:deploy && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        # Set this by hand — the TiDB Cloud string, never committed. Port 4000.
        # ?sslaccept=strict is added automatically if you leave it off; TiDB
        # rejects any connection that is not TLS.
        sync: false
      - key: AUTH_SECRET
        # Render generates this once and keeps it across deploys. Sessions do
        # not depend on it, so even a rotation would not sign anybody out.
        generateValue: true
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
